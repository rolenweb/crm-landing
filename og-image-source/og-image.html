<!--
  Источник для og-image.png (превью при шаринге в Telegram/WhatsApp/соцсетях).
  Как получить PNG 1200x630:
  1. Открой этот файл в Chrome.
  2. Открой DevTools (F12) → вкладка Elements.
  3. Найди в дереве DOM элемент <div class="wrap">.
  4. ПКМ по нему → Capture node screenshot.
  5. Chrome сохранит PNG точного размера 1200x630 — переименуй в og-image.png
     и положи в корень проекта (рядом с index.html).
-->
<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1200px; height:630px; overflow:hidden;
    font-family:'Inter', -apple-system, sans-serif;
    background: linear-gradient(135deg, #F9FAFB 0%, #EAF7F5 60%, #DFF3F0 100%);
  }
  .wrap {
    position:relative;
    width:1200px; height:630px;
    padding:80px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    background: linear-gradient(135deg, #F9FAFB 0%, #EAF7F5 60%, #DFF3F0 100%);
    overflow:hidden;
  }
  .blob {
    position:absolute;
    border-radius:50%;
    background: rgba(76,187,171,0.16);
  }
  .blob1 { width:520px; height:520px; top:-180px; right:-140px; }
  .blob2 { width:340px; height:340px; bottom:-160px; right:120px; background: rgba(76,187,171,0.10); }
  .logo {
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:48px;
  }
  .logo-icon {
    width:52px; height:52px; border-radius:14px;
    background:#4CBBAB;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:28px;
  }
  .logo-name {
    font-weight:700; font-size:28px; color:#1F2937;
  }
  h1 {
    font-size:56px;
    font-weight:800;
    line-height:1.15;
    color:#1F2937;
    max-width:820px;
    letter-spacing:-0.02em;
    margin-bottom:28px;
  }
  h1 span { color:#3ea296; }
  p {
    font-size:26px;
    font-weight:400;
    line-height:1.5;
    color:#6B7280;
    max-width:760px;
  }
  .pills {
    display:flex;
    gap:12px;
    margin-top:40px;
  }
  .pill {
    padding:10px 20px;
    border-radius:999px;
    background:#fff;
    border:1.5px solid #E5E7EB;
    font-size:18px;
    font-weight:600;
    color:#1F2937;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="logo">
    <div class="logo-icon">S</div>
    <div class="logo-name">Styber</div>
  </div>
  <h1>Интеграция <span>CRM</span> и&nbsp;автоматизация бизнеса под&nbsp;ключ</h1>
  <p>Bitrix24, amoCRM, Telegram, WhatsApp, 1С и&nbsp;API&nbsp;— настраиваем и&nbsp;интегрируем под&nbsp;ваш бизнес.</p>
  <div class="pills">
    <div class="pill">Bitrix24</div>
    <div class="pill">amoCRM</div>
    <div class="pill">Telegram</div>
    <div class="pill">WhatsApp</div>
  </div>
</div>
</body>
</html>
